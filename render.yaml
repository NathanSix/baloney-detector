services:
  - type: web
    name: baloney-detector
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
